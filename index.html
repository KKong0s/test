<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Media & Mental Health Dashboard</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
      "recharts": "https://esm.sh/recharts@2.12.2"
    }
  }
  </script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Inter', 'Noto Sans Thai', sans-serif;
      background-color: #020617;
      color: #f8fafc;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #0f172a;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 10px;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Note: data-type="module" tells Babel to treat this as an ES Module -->
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import { 
      PieChart, Pie, Cell, ResponsiveContainer, Tooltip, 
      BarChart, Bar, XAxis, YAxis, CartesianGrid, Legend 
    } from 'recharts';

    // Using relative path for the local file
    const CSV_URL = './social_media_mental_health.csv';
    
    const PLAT_COLORS = {
      'TikTok': '#ff0050',
      'Instagram': '#E1306C',
      'YouTube': '#FF0000',
      'Twitter/X': '#1DA1F2',
      'Snapchat': '#FFFC00',
      'LinkedIn': '#0077B5',
      'Facebook': '#1877F2'
    };

    const App = () => {
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      useEffect(() => {
        const fetchData = async () => {
          try {
            const response = await fetch(CSV_URL);
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            
            const text = await response.text();
            
            // Handle both \n and \r\n line endings
            const rows = text.split(/\r?\n/).filter(row => row.trim());
            if (rows.length < 2) throw new Error("ไฟล์ CSV ไม่มีข้อมูล");

            const headers = rows[0].split(',').map(h => h.trim());
            
            const parsed = rows.slice(1).map(row => {
              const values = row.split(',');
              let obj = {};
              headers.forEach((h, i) => {
                let val = values[i]?.trim();
                // Basic numeric detection
                if (val !== undefined && val !== '' && !isNaN(val)) {
                  obj[h] = Number(val);
                } else {
                  obj[h] = val;
                }
              });
              return obj;
            });

            setData(parsed);
            setLoading(false);
          } catch (err) {
            console.error("Data loading error:", err);
            setError(`ไม่สามารถโหลดข้อมูลได้: ${err.message}`);
            setLoading(false);
          }
        };

        fetchData();
      }, []);

      const stats = useMemo(() => {
        if (!data.length) return null;

        const totalAge = data.reduce((acc, curr) => acc + (Number(curr.Age) || 0), 0);
        const avgAge = (totalAge / data.length).toFixed(1);

        const totalScreen = data.reduce((acc, curr) => acc + (Number(curr.Daily_Screen_Time_Hours) || 0), 0);
        const avgScreen = (totalScreen / data.length).toFixed(1);

        const totalGAD = data.reduce((acc, curr) => acc + (Number(curr.GAD_7_Score) || 0), 0);
        const avgGAD = (totalGAD / data.length).toFixed(1);
        
        const platforms = data.reduce((acc, curr) => {
          const p = curr.Primary_Platform;
          if (p) acc[p] = (acc[p] || 0) + 1;
          return acc;
        }, {});

        const donutData = Object.entries(platforms)
          .map(([name, value]) => ({ name, value }))
          .sort((a, b) => b.value - a.value);

        const femaleData = data.filter(d => d.Gender === 'Female');
        const maleData = data.filter(d => d.Gender === 'Male');

        const getTopApps = (subset) => {
          const counts = subset.reduce((acc, curr) => {
            const p = curr.Primary_Platform;
            if (p) acc[p] = (acc[p] || 0) + 1;
            return acc;
          }, {});
          return Object.entries(counts)
            .map(([name, value]) => ({ name, value }))
            .sort((a, b) => b.value - a.value)
            .slice(0, 5);
        };

        return { 
          avgAge, 
          avgScreen, 
          avgGAD, 
          donutData, 
          femaleTop: getTopApps(femaleData), 
          maleTop: getTopApps(maleData) 
        };
      }, [data]);

      if (loading) return (
        <div className="h-screen flex items-center justify-center bg-slate-950 text-white">
          <div className="text-center">
            <div className="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <p className="text-lg font-medium">กำลังโหลดข้อมูล...</p>
          </div>
        </div>
      );

      if (error) return (
        <div className="h-screen flex items-center justify-center bg-slate-950 text-red-400 p-6 text-center">
          <div className="max-w-md glass-card p-8 rounded-2xl border border-red-500/20">
            <h1 className="text-2xl font-bold mb-4">เกิดข้อผิดพลาด</h1>
            <p className="mb-6 opacity-80">{error}</p>
            <button 
              onClick={() => window.location.reload()}
              className="px-6 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg transition-colors font-bold"
            >
              ลองใหม่อีกครั้ง
            </button>
          </div>
        </div>
      );

      return (
        <div className="min-h-screen p-4 md:p-8 max-w-7xl mx-auto space-y-6">
          <header className="flex flex-col md:flex-row md:items-end justify-between gap-4 border-b border-slate-800 pb-6">
            <div>
              <h1 className="text-3xl font-extrabold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
                Mental Health Insights
              </h1>
              <p className="text-slate-400 mt-1">บทวิเคราะห์พฤติกรรมการใช้โซเชียลมีเดียและสุขภาพจิตจากไฟล์ข้อมูล</p>
            </div>
            <div className="text-right">
              <span className="bg-blue-500/10 text-blue-400 px-3 py-1 rounded-full text-sm font-semibold border border-blue-500/20">
                Data Points: {data.length}
              </span>
            </div>
          </header>

          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <StatCard label="อายุเฉลี่ย" value={stats.avgAge} unit="ปี" icon="👥" color="text-blue-400" />
            <StatCard label="Screen Time" value={stats.avgScreen} unit="ชม./วัน" icon="📱" color="text-emerald-400" />
            <StatCard label="เฉลี่ย GAD-7" value={stats.avgGAD} unit="คะแนน" icon="🧠" color="text-purple-400" />
            <StatCard label="กลุ่มตัวอย่าง" value={data.length} unit="คน" icon="📊" color="text-orange-400" />
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 glass-card p-6 rounded-2xl shadow-xl">
              <h2 className="text-xl font-bold mb-6 flex items-center gap-2">
                <span className="w-2 h-6 bg-blue-500 rounded-full"></span>
                แพลตฟอร์มหลักที่ใช้งาน (Primary Platform)
              </h2>
              <div className="h-[350px]">
                <ResponsiveContainer width="100%" height="100%">
                  <BarChart data={stats.donutData} margin={{ top: 20, right: 30, left: 0, bottom: 0 }}>
                    <CartesianGrid strokeDasharray="3 3" stroke="#1e293b" vertical={false} />
                    <XAxis dataKey="name" stroke="#94a3b8" tick={{ fontSize: 12 }} />
                    <YAxis stroke="#94a3b8" tick={{ fontSize: 12 }} />
                    <Tooltip 
                      contentStyle={{ backgroundColor: '#0f172a', border: '1px solid #334155', borderRadius: '8px' }}
                      itemStyle={{ color: '#fff' }}
                    />
                    <Bar dataKey="value" radius={[4, 4, 0, 0]}>
                      {stats.donutData.map((entry, index) => (
                        <Cell key={`cell-${index}`} fill={PLAT_COLORS[entry.name] || '#6366f1'} />
                      ))}
                    </Bar>
                  </BarChart>
                </ResponsiveContainer>
              </div>
            </div>

            <div className="glass-card p-6 rounded-2xl shadow-xl space-y-8">
               <GenderSection title="ความนิยม: หญิง" data={stats.femaleTop} color="#f472b6" icon="👩‍🦰" />
               <GenderSection title="ความนิยม: ชาย" data={stats.maleTop} color="#60a5fa" icon="👨‍🦱" />
            </div>
          </div>

          <div className="glass-card rounded-2xl shadow-xl overflow-hidden border border-slate-800">
            <div className="p-4 border-b border-slate-800 bg-slate-900/50 flex justify-between items-center">
               <h3 className="font-bold text-slate-200">ตัวอย่างข้อมูลรายบุคคล (Sample)</h3>
               <span className="text-xs text-slate-500">แสดงข้อมูล 10 แถวแรก</span>
            </div>
            <div className="overflow-x-auto custom-scrollbar">
              <table className="w-full text-left text-sm border-collapse">
                <thead>
                  <tr className="bg-slate-900/80 text-slate-400">
                    <th className="p-4 font-semibold">User ID</th>
                    <th className="p-4 font-semibold">Age</th>
                    <th className="p-4 font-semibold">Gender</th>
                    <th className="p-4 font-semibold">Platform</th>
                    <th className="p-4 font-semibold text-center">Screen Time</th>
                    <th className="p-4 font-semibold text-center">GAD-7</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800">
                  {data.slice(0, 10).map((row, i) => (
                    <tr key={i} className="hover:bg-slate-800/30 transition-colors">
                      <td className="p-4 text-slate-300 font-mono">{row.User_ID}</td>
                      <td className="p-4 text-slate-300">{row.Age}</td>
                      <td className="p-4">
                        <span className={`px-2 py-0.5 rounded-md text-xs ${row.Gender === 'Female' ? 'bg-pink-500/10 text-pink-400' : 'bg-blue-500/10 text-blue-400'}`}>
                          {row.Gender}
                        </span>
                      </td>
                      <td className="p-4 text-slate-300 font-medium">{row.Primary_Platform}</td>
                      <td className="p-4 text-center text-emerald-400 font-bold">{row.Daily_Screen_Time_Hours}h</td>
                      <td className="p-4 text-center">
                         <span className={`px-2 py-0.5 rounded text-xs font-bold ${Number(row.GAD_7_Score) >= 10 ? 'bg-red-500 text-white' : 'bg-slate-700 text-slate-300'}`}>
                           {row.GAD_7_Score}
                         </span>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          <footer className="text-center text-slate-500 text-xs py-10">
            &copy; 2024 Mental Health Data Analysis Dashboard • Built with React & Recharts
          </footer>
        </div>
      );
    };

    const StatCard = ({ label, value, unit, icon, color }) => (
      <div className="glass-card p-5 rounded-2xl flex items-center justify-between border-l-4 border-l-blue-500 hover:scale-[1.02] transition-transform cursor-default">
        <div>
          <p className="text-slate-400 text-xs font-medium uppercase tracking-wider">{label}</p>
          <div className="flex items-baseline gap-1 mt-1">
            <span className={`text-2xl font-bold ${color}`}>{value}</span>
            <span className="text-slate-500 text-sm">{unit}</span>
          </div>
        </div>
        <span className="text-3xl opacity-80">{icon}</span>
      </div>
    );

    const GenderSection = ({ title, data, color, icon }) => {
      const maxVal = data.length > 0 ? data[0].value : 1;
      return (
        <div className="space-y-4">
          <h3 className="text-sm font-bold flex items-center gap-2 uppercase tracking-tight" style={{ color }}>
            {icon} {title}
          </h3>
          <div className="space-y-2">
            {data.length > 0 ? data.map((item, idx) => (
              <div key={item.name} className="flex flex-col gap-1">
                <div className="flex justify-between text-xs font-medium">
                  <span className="text-slate-300">{item.name}</span>
                  <span className="text-slate-500">{item.value} คน</span>
                </div>
                <div className="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                  <div 
                    className="h-full rounded-full transition-all duration-1000"
                    style={{ 
                      width: `${(item.value / maxVal) * 100}%`,
                      backgroundColor: PLAT_COLORS[item.name] || color
                    }}
                  />
                </div>
              </div>
            )) : <p className="text-xs text-slate-500 italic">ไม่มีข้อมูลเพียงพอ</p>}
          </div>
        </div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
